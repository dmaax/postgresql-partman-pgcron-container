name: Docker

on:
  schedule:
    - cron: "18 2 * * *"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dmaax/postgresql-partman-pgcron
  PARTMAN_VERSION: v5.2.4
  PARTMAN_CHECKSUM: 8328a00ce1a55a5c9173d4adbf251e784fed62413fb76bba89dd893749a720a5ecb25ee668eb0b826b8e1f2b89d9dd7da219fd797bfd9ab1a43d05f5b3ac494f
  PG_CRON_VERSION: v1.6.7
  PG_CRON_CHECKSUM: e3274d7223f7b5c297595397273bd3a9152c43b773b8006feb22b0be74b25b8248d6ea39cebebf2fe4bf7db63dbd74269f86d8422ecf2b4b38d815b222562d1a

jobs:
  build:
    strategy:
      matrix:
        postgres_version: [15, 16, 17, 18]

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install cosign (skip on PR)
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.4.0

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR
      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker metadata (tags + labels)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ matrix.postgres_version == '18' }}
            type=raw,value=${{ matrix.postgres_version }}

      # Build and push image (digest)
      - name: Build and push image (digest)
        id: build-digest
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pipeline
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            POSTGRESQL_VERSION=${{ matrix.postgres_version }}
            PARTMAN_VERSION=${{ env.PARTMAN_VERSION }}
            PARTMAN_CHECKSUM=${{ env.PARTMAN_CHECKSUM }}
            PG_CRON_VERSION=${{ env.PG_CRON_VERSION }}
            PG_CRON_CHECKSUM=${{ env.PG_CRON_CHECKSUM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Basic runtime test
      - name: Test Docker image
        env:
          POSTGRES_PASSWORD: testpassword
        run: |
          DIGEST=${{ steps.build-digest.outputs.digest }}
          docker run -d --name test-db \
            -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$DIGEST

          sleep 30
          docker exec test-db pg_isready -U postgres
          docker stop test-db
          docker rm test-db

      # Build and push final tags (release)
      - name: Build and push image (release)
        id: build-release
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            POSTGRESQL_VERSION=${{ matrix.postgres_version }}
            PARTMAN_VERSION=${{ env.PARTMAN_VERSION }}
            PARTMAN_CHECKSUM=${{ env.PARTMAN_CHECKSUM }}
            PG_CRON_VERSION=${{ env.PG_CRON_VERSION }}
            PG_CRON_CHECKSUM=${{ env.PG_CRON_CHECKSUM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign images with cosign
      - name: Sign published images
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n')
          for TAG in $TAGS; do
            cosign sign -y "$TAG"
          done
